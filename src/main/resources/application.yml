spring:
  application:
    name: mall
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mall}
    username: ${DB_USER:mall}
    password: ${DB_PASSWORD:mall}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:mall-redis-dev}
      timeout: 2s
  cache:
    type: redis
    redis:
      time-to-live: 300000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

server:
  port: 8080
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

mall:
  jobs:
    enabled: true
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000
  payment:
    callback-secret: ${PAY_CALLBACK_SECRET:}
  rate-limit:
    orders-per-minute: 30
    logins-per-minute: 20
  order:
    pay-timeout: 15m
    close-scan-ms: 5000
  outbox:
    poll-ms: 1000
    max-attempts: 8
    claim-lease-seconds: 30
  alert:
    scan-ms: 15000
    pending-stale: 60s
  seckill:
    poll-ms: 200
    max-attempts: 5
    result-ttl: 24h

logging:
  level:
    com.mall.mapper: INFO
